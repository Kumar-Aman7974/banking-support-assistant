services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: banking-postgres
    environment:
      POSTGRES_DB: banking_support_db
      POSTGRES_USER: banking_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking_user -d banking_support_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: