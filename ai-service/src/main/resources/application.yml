server:
  port: 8082

spring:
  application:
    name: ai-service

  datasource:
    url: jdbc:postgresql://localhost:5432/banking_support_db
    username: banking_user
    password: banking_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
    table: flyway_schema_history_ai

  servlet:
    multipart:
      max-file-size: 20MB

  # ===== SPRING AI 2.0 CONFIGURATION =====
  ai:
    model: # singular "model", not "models"
      embedding:
        text: google-genai
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-2.5-flash-lite
            temperature: 0.3
        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            options:
              model: gemini-embedding-001
              dimensions: 1536

    # Vector store (unchanged)
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        initialize-schema: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

rag:
  chunk-size: 800
  chunk-overlap: 100
  top-k: 5