server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: ticket-service
              uri: lb://ticket-service
              predicates:
                - Path=/api/v1/auth/**,/api/v1/tickets/**

            - id: ai-service
              uri: lb://ai-service
              predicates:
                - Path=/api/v1/chat/**,/api/v1/documents/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG