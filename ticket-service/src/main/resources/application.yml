server:
  port: 8081

spring:
  application:
    name: ticket-service


  datasource:
    url: jdbc:postgresql://localhost:5432/banking_support_db
#    username: postgres
#    password: ${DB_PASSWORD}
    username: banking_user
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  ai:
    vectorstore:
      pgvector:
        initialize-schema:true
        index-type:HNSW
        distance-type:COSINE_DISTANCE
        dimensions:768

  jpa:
    hibernate:
      ddl-auto: validate
      show-sql: true
      properties:
        hibernate:
          format_sql: true
          dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration


  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka/
      instance:
        prefer-ip-address: true